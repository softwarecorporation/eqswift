[package]
name = "cargo-eqswift"
version = "0.2.0"
edition = "2021"
authors = ["eqswift contributors"]
description = "Build Rust-to-Swift bindings, Apple XCFrameworks, and consumable Swift packages"
license = "ISC"
repository = "https://github.com/softwarecorporation/eqswift"
keywords = ["cargo-subcommand", "ffi", "swift", "uniffi", "bindings"]
categories = ["development-tools::cargo-plugins", "development-tools::ffi"]
rust-version = "1.91"

[[bin]]
name = "cargo-eqswift"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
anyhow = "1.0"
cargo_metadata = "0.18"
fs-err = "2.11"
uniffi_bindgen = { version = "=0.32.1", default-features = false }
camino = "1"
tempfile = "3.10"
